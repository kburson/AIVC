name: CI

on:
  pull_request:
  push:
    branches:
      - trunk
      - codex/2-draft
      - codex/25-quality-scans
  workflow_dispatch:

permissions:
  contents: read

env:
  AIVC_MODE: mock
  PLAYWRIGHT_LAST_RUN_OUTPUT_FILE: .tmp/playwright-last-run.json

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: node --version
      - run: npm --version
      - run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm run lint:code

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: node --version
      - run: npm --version
      - run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm run verify:sealed-evidence
      - run: npm run format:check

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: node --version
      - run: npm --version
      - run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm run lint:markdown

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: node --version
      - run: npm --version
      - run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Unit and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: node --version
      - run: npm --version
      - run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npm run test:evidence
      - run: npm test

  acceptance:
    name: Offline system acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: node --version
      - run: npm --version
      - run: node scripts/verify-toolchain.mjs
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run assets:vad
      - run: npm run test:contracts
      - run: npm run test:integration
      - run: npm run test:voice
      - run: npm run test:slow
      - run: npm run test:browser
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:docs
